<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>2026名古屋亞運｜中華台北代表團每日賽程查詢</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <h1>2026名古屋亞運</h1>
  <p class="subtitle">中華台北代表團每日賽程查詢</p>
  <p class="org-line">國家運動訓練中心｜競技運動處</p>
  <span class="internal-badge">此資料為內部參考使用</span>
</header>
<div class="header-accent-line"></div>

<!-- 日期切換列（緊貼頁首，維持原有互動邏輯） -->
<section class="date-nav" aria-label="日期選擇">
  <button id="prevDayBtn" class="date-arrow" aria-label="前一天">‹</button>
  <div id="dateStrip" class="date-strip" role="listbox" aria-label="選擇日期"></div>
  <button id="nextDayBtn" class="date-arrow" aria-label="後一天">›</button>
</section>

<main>

  <!-- 搜尋 + 搜尋範圍 -->
  <section class="panel">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="搜尋選手、項目、場館、對手…" autocomplete="off">
      <button id="clearSearchBtn" class="clear-btn" style="display:none;" aria-label="清除搜尋">✕</button>
    </div>

    <p class="panel-label">搜尋範圍</p>
    <div class="search-scope">
      <button class="scope-btn active" data-scope="today">當日</button>
      <button class="scope-btn" data-scope="all">全部日期</button>
    </div>
  </section>

  <!-- 項目篩選 -->
  <section class="panel">
    <p class="panel-label">項目篩選</p>
    <div id="sportFilter" class="sport-filter" aria-label="運動項目篩選"></div>
  </section>

  <!-- 全部 / 接下來 -->
  <section class="panel">
    <p class="panel-label">賽程顯示</p>
    <div class="view-toggle">
      <button class="toggle-btn active" data-view="all">全部</button>
      <button class="toggle-btn" data-view="upcoming">接下來</button>
    </div>
  </section>

  <!-- 結果標題 / 數量統計 -->
  <section class="result-header">
    <h2 id="resultTitle">今日賽程</h2>
    <p id="resultCount" class="result-count">共 0 筆賽程</p>
  </section>

  <!-- 賽程列表 -->
  <section id="scheduleList" class="schedule-list" aria-live="polite"></section>

  <!-- 空狀態 -->
  <div id="emptyState" class="empty-state" style="display:none;">
    <p id="emptyMessage">今日無中華台北代表隊賽程</p>
    <button id="emptyActionBtn" class="empty-action-btn" style="display:none;"></button>
  </div>

</main>

<footer class="app-footer">
  <p id="footerDesktop" class="footer-desktop"></p>
  <div id="footerMobile" class="footer-mobile">
    <p id="footerMobileDate"></p>
    <p>資料僅供內部作業參考使用</p>
    <p>正式資料請以主辦單位公告為準</p>
    <p>建置與維護：國家運動訓練中心競技運動處</p>
  </div>
</footer>

<script src="data/schedule.js"></script>
<script src="script.js"></script>
</body>
</html>
